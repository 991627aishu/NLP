<!DOCTYPE html><html><head><title>Herbal Pharmacopoeia</title></head><body><h1>Botanical Monographs</h1><p>Ashwagandha (Withania somnifera) is classified as a Rasayana herb with Balya and Medhya properties.</p><p>Amalaki (Phyllanthus emblica) exhibits all rasas except lavana, providing potent Tridoshahara actions.</p></body></html>
